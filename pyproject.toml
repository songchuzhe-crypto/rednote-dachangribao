[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigtech-daily"
version = "0.0.1"
description = "Minimal CLI skeleton for bigtech daily"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OpenAI", email = "noreply@example.com"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
bigtech-daily = "bigtech_daily.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
